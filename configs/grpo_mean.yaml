# Control arm: standard GRPO with a group-mean baseline.
# The treatment configs differ from this file ONLY in the risk block.
model: runs/sft/final
dataset: openai/gsm8k
dataset_config: main
split: train
question_field: question
answer_field: answer
max_samples: 2000
output_dir: runs/grpo_mean

risk:
  estimator: mean

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  task_type: CAUSAL_LM

training:
  num_train_epochs: 1
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  num_generations: 8          # group size G; risk.alpha must be >= 1/G
  max_completion_length: 512
  learning_rate: 1.0e-6
  beta: 0.04                  # TRL's KL coefficient, unrelated to risk.beta
  temperature: 0.9
  # Rollout generation (the dominant cost -- G=8 completions per prompt every
  # step) via TRL's built-in vLLM integration instead of plain
  # model.generate(); colocate mode runs vLLM in the same process/GPU as
  # training, no separate server needed. vllm_gpu_memory_utilization left at
  # its 0.3 default -- plenty of headroom for a 1.5B model + LoRA on a 24GB
  # card, leaving the rest for the training side.
  use_vllm: true
  vllm_mode: colocate
  # T4 (Turing, sm_75) has no bf16 tensor-core support; fp16 is native there.
  fp16: true
  logging_steps: 5
  save_strategy: "no"
  seed: 0
