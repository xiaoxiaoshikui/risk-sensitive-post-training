model: runs/sft/final
pairs_file: data/dpo_pairs.jsonl
output_dir: runs/dpo

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  task_type: CAUSAL_LM

training:
  num_train_epochs: 1
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-6
  beta: 0.1
  max_length: 1024
  max_prompt_length: 512
  bf16: true
  logging_steps: 10
  save_strategy: "no"
  seed: 0
