model: runs/sft/final
pairs_file: data/dpo_pairs.jsonl
output_dir: runs/dpo

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  task_type: CAUSAL_LM

training:
  num_train_epochs: 1
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-6
  beta: 0.1
  # DPOConfig dropped the separate max_prompt_length control -- max_length now
  # governs the whole tokenized example, with truncation_mode (default
  # "keep_start") deciding what gets cut if it's too long.
  max_length: 1024
  # bf16 needs Ampere+ (sm_80+); native on the rented RTX 4090 (Ada, sm_89) this
  # is tuned for, and more numerically stable than fp16 for LLM training. Not
  # valid on Kaggle's T4 (Turing, sm_75, no bf16 tensor cores) -- flip to
  # fp16 there.
  bf16: true
  logging_steps: 10
  save_strategy: "no"
  seed: 0
