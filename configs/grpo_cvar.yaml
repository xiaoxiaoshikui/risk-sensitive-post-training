# Treatment arm: CVaR baseline. Identical to grpo_mean.yaml except risk.*
model: runs/sft/final
dataset: openai/gsm8k
dataset_config: main
split: train
question_field: question
answer_field: answer
max_samples: 2000
output_dir: runs/grpo_cvar

risk:
  estimator: cvar
  alpha: 0.25          # with G=8, the 2 worst rollouts form the tail
  lambda_risk: 1.0     # anneal from 0.0 if the run is unstable

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  task_type: CAUSAL_LM

training:
  num_train_epochs: 1
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  num_generations: 8
  max_completion_length: 512
  learning_rate: 1.0e-6
  beta: 0.04
  temperature: 0.9
  # T4 (Turing, sm_75) has no bf16 tensor-core support; fp16 is native there.
  fp16: true
  logging_steps: 5
  save_strategy: "no"
  seed: 0
