model: Qwen/Qwen2.5-1.5B-Instruct
dataset: openai/gsm8k
dataset_config: main
split: train
question_field: question
answer_field: answer
max_samples: 4000
output_dir: runs/sft

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  task_type: CAUSAL_LM

training:
  num_train_epochs: 1
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  bf16: true
  max_length: 1024
  logging_steps: 10
  save_strategy: "no"
  seed: 0
  # trl>=1.x defaults SFTConfig to loss_type="chunked_nll", a memory-saving
  # variant that patches the model's forward. With a PEFT/LoRA model this hits
  # a bug in trl 1.10.0 (AttributeError: 'functools.partial' object has no
  # attribute '__func__' in _patch_chunked_ce_lm_head). "nll" is the
  # standard, well-tested loss and is functionally equivalent here.
  loss_type: nll
